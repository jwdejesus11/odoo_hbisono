services:
  web:
    build: .
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - DB_NAME=hbisono_prod
    command: >
      sh -c "odoo --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons -d hbisono_prod -i l10n_do_accounting --stop-after-init && 
             odoo --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons -d hbisono_prod"
    volumes:
      - odoo-data:/var/lib/odoo

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata

volumes:
  odoo-db-data:
  odoo-data:

