services:
  web:
    build: .
    depends_on:
      - db

    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - DB_NAME=hbisono_prod
    ports:
      - 8069:8069


    command: >
      sh -c "echo \"env.cr.execute('UPDATE res_company SET currency_id = (SELECT id FROM res_currency WHERE name = \\'DOP\\') WHERE id = 1'); env.cr.commit()\" | odoo shell -d hbisono_prod --db_host=db --db_user=odoo --db_password=odoo --no-http --stop-after-init; 
             odoo --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons --db_host=db --db_user=odoo --db_password=odoo -d hbisono_prod"











    volumes:
      - odoo-data:/var/lib/odoo

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata

volumes:
  odoo-db-data:
  odoo-data:

